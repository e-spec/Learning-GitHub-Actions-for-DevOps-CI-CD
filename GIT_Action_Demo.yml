# This workflow is a simple example of GitHub Actions
# It shows how to run jobs on different operating systems

name: A Basic Workflow   # Name shown in the GitHub Actions UI

# Defines when this workflow should run
on:
  # Run when code is pushed to the main branch
  push:
    branches: [ "main" ]

  # Run when a pull request targets the main branch
  pull_request:
    branches: [ "main" ]

  # Allow manual execution from the Actions tab
  workflow_dispatch:

# A workflow consists of one or more jobs
jobs:

  # Job 1: Build the application
  build-app:
    # This job runs on a Linux machine provided by GitHub
    runs-on: ubuntu-latest

    # Steps are executed in order inside the job
    steps:
      # Download (checkout) the repository so the job can access the code
      - uses: actions/checkout@v3

      # Run a single shell command
      - name: Run a one-line script
        run: echo Hello, world!

      # Run multiple shell commands
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

  # Job 2: Build the API
  build-api:
    # This job runs on a Windows machine
    runs-on: windows-latest

    steps:
      # Simple placeholder command
      - run: echo "Building API"

  # Job 3: Build the database
  build-db:
    # This job depends on build-app
    # It will NOT run until build-app succeeds
    needs: build-app

    # Runs on Windows
    runs-on: windows-latest

    steps:
      - run: echo "Hello Windows"

  # Job 4: Package everything
  package:
    # This job waits for both build-app and build-db to succeed
    needs: [build-app, build-db]

    # Runs on macOS
    runs-on: macos-latest

    steps:
      # Final placeholder step
      - run: echo "Hello MacOS"
