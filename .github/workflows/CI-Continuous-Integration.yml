name: CI Continuous Integration Demo

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'   # .NET 10 is preview; use 8 unless you specifically need 10

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        working-directory: ./WebApp01
        run: dotnet restore

      - name: Build
        working-directory: ./WebApp01
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: ./WebApp01
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./WebApp01/publish
